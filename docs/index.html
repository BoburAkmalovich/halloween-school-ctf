<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тайна школы №13</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"></main>
<script>
const puzzles=[
 {icon:'🖼️',title:'Портрет, который шепчет',skill:'HTML и исходный код',story:'В старом холле висит портрет директора. Он шепчет: «Не всё видно на странице…»',task:'Найди флаг в исходном коде страницы: Ctrl+U, затем поиск по слову HALLOWEEN.',hint:'Нажми Ctrl+U и используй Ctrl+F.',answer:'HALLOWEEN{GHOST_IN_HTML}'},
 {icon:'🧪',title:'Шифр ведьминого котла',skill:'Шифр Цезаря',story:'Буквы записки сдвинуты на три шага вперёд по английскому алфавиту.',task:'Расшифруй: KDOORZHHQ{FDW_VDBV_PHRZ}',hint:'Сдвигай буквы на 3 назад: K→H, D→A.',answer:'HALLOWEEN{CAT_SAYS_MEOW}'},
 {icon:'🚪',title:'Запретная комната',skill:'robots.txt и пути сайта',story:'Робот-уборщик знает, куда ему запрещено заходить.',task:'Открой robots.txt рядом с адресом сайта, найди запретный путь и перейди туда.',hint:'Замени index.html в адресе на robots.txt.',answer:'HALLOWEEN{ROBOTS_ARE_AFRAID}'},
 {icon:'🦇',title:'Радио летучих мышей',skill:'Азбука Морзе',story:'Стая передаёт короткие и длинные писки.',task:'Расшифруй: .... .- .-.. .-.. --- .-- . . -. / -... .- - и запиши как HALLOWEEN{ДВА_СЛОВА}.',hint:'Слэш разделяет слова, пробелы — буквы.',answer:'HALLOWEEN{HALLOWEEN_BAT}'},
 {icon:'🪞',title:'Зеркало полуночи',skill:'Преобразование строк',story:'Последнюю надпись можно прочитать только в отражении.',task:'Разверни строку: }DEKCAB_TON_SI_TI{NEEWOLLAH',hint:'Читай с последнего символа к первому.',answer:'HALLOWEEN{IT_IS_NOT_BACKED}'}];
// Первый флаг для внимательного охотника: HALLOWEEN{GHOST_IN_HTML}
let level=+(localStorage.ctfLevel||0),name=localStorage.ctfName||'',hints=+(localStorage.ctfHints||0);
const app=document.querySelector('#app');
function start(){name=document.querySelector('#name').value.trim()||'Охотник';level=0;hints=0;localStorage.ctfName=name;localStorage.ctfLevel=0;localStorage.ctfHints=0;render()}
function render(){if(!name){app.innerHTML=`<section class="hero"><div class="moon">🦇</div><p class="eyebrow">HALLOWEEN CTF · 13+</p><h1>Тайна<br><span>школы №13</span></h1><p class="lead">Пять печатей заперли выход. Разгадай цифровые тайны до рассвета.</p><div class="chips"><span>5 испытаний</span><span>≈ 35 минут</span><span>Есть подсказки</span></div><div class="panel"><label>Имя охотника</label><input id="name" maxlength="24" placeholder="Например: Тёмный Лис"><button onclick="start()">Войти в школу →</button></div></section>`;return}if(level>=puzzles.length){app.innerHTML=`<section class="hero"><div class="moon">☀️</div><p class="eyebrow">ДЕЛО ЗАКРЫТО</p><h1>Рассвет<br><span>наступил!</span></h1><p class="lead"><b>${esc(name)}</b>, все пять печатей разрушены. Подсказок использовано: ${hints}.</p><button onclick="name='';localStorage.clear();render()">Пройти ещё раз</button></section>`;return}const p=puzzles[level];app.innerHTML=`<header><b>ШКОЛА <i>№13</i></b><span>${esc(name)} ●</span></header><div class="layout"><aside><p class="eyebrow">НОЧЬ ЕЩЁ НЕ КОНЧИЛАСЬ</p><div class="bar"><i style="width:${level/5*100}%"></i></div><p>Печать ${level+1} из 5</p>${puzzles.map((_,i)=>`<div class="step ${i==level?'active':''}">${i<level?'✓':('0'+(i+1)).slice(-2)} · ${i<level?'Снята':i==level?'Ты здесь':'Заперто'}</div>`).join('')}</aside><section class="challenge"><p class="eyebrow">ИСПЫТАНИЕ ${('0'+(level+1)).slice(-2)} · ${p.skill}</p><div class="icon">${p.icon}</div><h2>${p.title}</h2><p class="story">${p.story}</p><div class="task"><b>ТВОЯ ЗАДАЧА</b><p>${p.task}</p></div><label>Введи найденный флаг</label><div class="row"><input id="flag" placeholder="HALLOWEEN{...}"><button onclick="check()">Проверить</button></div><p id="msg"></p><button class="hint" onclick="showHint()">🕯️ Зажечь свечу-подсказку</button><p id="hint"></p></section></div>`}
function check(){let v=document.querySelector('#flag').value.replace(/\s/g,'').toUpperCase(),m=document.querySelector('#msg');if(v===puzzles[level].answer){m.className='ok';m.textContent='Печать разрушена!';level++;localStorage.ctfLevel=level;setTimeout(render,800)}else{m.className='bad';m.textContent='Заклинание не сработало. Проверь флаг.'}}
function showHint(){document.querySelector('#hint').textContent=puzzles[level].hint;hints++;localStorage.ctfHints=hints}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
