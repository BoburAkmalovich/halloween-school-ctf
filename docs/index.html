<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Mystery of School No. 13</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"></main>
<script>
const puzzles=[
 {icon:'🖼️',title:'The Whispering Portrait',skill:'HTML source code',story:'A portrait of the headmaster hangs in the old hall. It whispers, “Not everything can be seen on the page…”',task:'Find the flag hidden in this page’s source code. Press Ctrl+U, then search for HALLOWEEN.',hint:'Press Ctrl+U and use Ctrl+F to search.',answer:'HALLOWEEN{GHOST_IN_HTML}'},
 {icon:'🧪',title:"The Witch's Cauldron Cipher",skill:'Caesar cipher',story:'The letters on a note have been shifted three places forward in the English alphabet.',task:'Decrypt: KDOORZHHQ{FDW_VDBV_PHRZ}',hint:'Shift every letter 3 places back: K→H, D→A.',answer:'HALLOWEEN{CAT_SAYS_MEOW}'},
 {icon:'🚪',title:'The Forbidden Room',skill:'robots.txt and web paths',story:'The school cleaning robot knows which rooms it must never enter.',task:'Open robots.txt next to the site address, find the forbidden path, and visit it.',hint:'Add robots.txt after the final slash in the website address.',answer:'HALLOWEEN{ROBOTS_ARE_AFRAID}'},
 {icon:'🦇',title:'Bat Radio',skill:'Morse code',story:'A colony of bats is transmitting short and long squeaks.',task:'Decode: .... .- .-.. .-.. --- .-- . . -. / -... .- - and write it as HALLOWEEN{TWO_WORDS}.',hint:'A slash separates words; spaces separate letters.',answer:'HALLOWEEN{HALLOWEEN_BAT}'},
 {icon:'🪞',title:'The Midnight Mirror',skill:'String transformation',story:'The final inscription can only be read in a reflection.',task:'Reverse this string: }DEKCAB_TON_SI_TI{NEEWOLLAH',hint:'Read it from the final character to the first.',answer:'HALLOWEEN{IT_IS_NOT_BACKED}'}];
// The first flag for a sharp-eyed ghost hunter: HALLOWEEN{GHOST_IN_HTML}
let level=+(localStorage.ctfLevel||0),name=localStorage.ctfName||'',hints=+(localStorage.ctfHints||0);
const app=document.querySelector('#app');
function start(){name=document.querySelector('#name').value.trim()||'Ghost Hunter';level=0;hints=0;localStorage.ctfName=name;localStorage.ctfLevel=0;localStorage.ctfHints=0;render()}
function render(){if(!name){app.innerHTML=`<section class="hero"><div class="moon">🦇</div><p class="eyebrow">HALLOWEEN CTF · AGES 13+</p><h1>The Mystery<br><span>of School No. 13</span></h1><p class="lead">Five seals have locked the exit. Solve the digital mysteries before sunrise.</p><div class="chips"><span>5 challenges</span><span>≈ 35 minutes</span><span>Hints available</span></div><div class="panel"><label>Ghost hunter name</label><input id="name" maxlength="24" placeholder="For example: Shadow Fox"><button onclick="start()">Enter the school →</button></div></section>`;return}if(level>=puzzles.length){app.innerHTML=`<section class="hero"><div class="moon">☀️</div><p class="eyebrow">CASE CLOSED</p><h1>Sunrise<br><span>has arrived!</span></h1><p class="lead"><b>${esc(name)}</b>, all five seals have been broken. Hints used: ${hints}.</p><button onclick="name='';localStorage.clear();render()">Play again</button></section>`;return}const p=puzzles[level];app.innerHTML=`<header><b>SCHOOL <i>NO. 13</i></b><span>${esc(name)} ●</span></header><div class="layout"><aside><p class="eyebrow">THE NIGHT IS NOT OVER</p><div class="bar"><i style="width:${level/5*100}%"></i></div><p>Seal ${level+1} of 5</p>${puzzles.map((_,i)=>`<div class="step ${i==level?'active':''}">${i<level?'✓':('0'+(i+1)).slice(-2)} · ${i<level?'Broken':i==level?'You are here':'Locked'}</div>`).join('')}</aside><section class="challenge"><p class="eyebrow">CHALLENGE ${('0'+(level+1)).slice(-2)} · ${p.skill}</p><div class="icon">${p.icon}</div><h2>${p.title}</h2><p class="story">${p.story}</p><div class="task"><b>YOUR MISSION</b><p>${p.task}</p></div><label>Enter the flag you found</label><div class="row"><input id="flag" placeholder="HALLOWEEN{...}"><button onclick="check()">Check</button></div><p id="msg"></p><button class="hint" onclick="showHint()">🕯️ Light a hint candle</button><p id="hint"></p></section></div>`}
function check(){let v=document.querySelector('#flag').value.replace(/\s/g,'').toUpperCase(),m=document.querySelector('#msg');if(v===puzzles[level].answer){m.className='ok';m.textContent='The seal is broken!';level++;localStorage.ctfLevel=level;setTimeout(render,800)}else{m.className='bad';m.textContent='The spell failed. Check the flag and try again.'}}
function showHint(){document.querySelector('#hint').textContent=puzzles[level].hint;hints++;localStorage.ctfHints=hints}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
