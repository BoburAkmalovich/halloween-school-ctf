<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Mystery of School No. 13</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"></main>
<script>
const puzzles=[
 {icon:'🖼️',title:'The Whispering Portrait',skill:'HTML source code',story:'A portrait of the headmaster hangs in the old hall. It whispers, “Not everything can be seen on the page…”',task:'Find the flag hidden in this page’s source code. Press Ctrl+U, then search for HALLOWEEN.',hint:'Press Ctrl+U and use Ctrl+F to search.',hash:'33de11b7d75e2696bdd7b09998fc2e5bd9359cf724d341e1689517226a248bc2'},
 {icon:'🧪',title:"The Witch's Cauldron Cipher",skill:'Caesar cipher',story:'The letters on a note have been shifted three places forward in the English alphabet.',task:'Decrypt: KDOORZHHQ{FDW_VDBV_PHRZ}',hint:'Shift every letter 3 places back: K→H, D→A.',hash:'b1b24be122200c51c240c7a9975774be875b19d85ec717275ccf61f7b2ae7028'},
 {icon:'🚪',title:'The Forbidden Room',skill:'robots.txt and web paths',story:'The school cleaning robot knows which rooms it must never enter.',task:'Open robots.txt next to the site address, find the forbidden path, and visit it.',hint:'Add robots.txt after the final slash in the website address.',hash:'853e20bbe22cd8427cdfb26a772efb3b70cb3ba8a72b176cf1c8235e0f5ee11c'},
 {icon:'🦇',title:'Bat Radio',skill:'Morse code',story:'A colony of bats is transmitting short and long squeaks.',task:'Decode: .... .- .-.. .-.. --- .-- . . -. / -... .- - and write it as HALLOWEEN{TWO_WORDS}.',hint:'A slash separates words; spaces separate letters.',hash:'8c9d13bd40cda502bd70abf4cbe854d5a73eca4c10ffd1c2c448b38854bfe2ff'},
 {icon:'🪞',title:'The Midnight Mirror',skill:'String transformation',story:'The final inscription can only be read in a reflection.',task:'Reverse this string: }DEKCAB_TON_SI_TI{NEEWOLLAH',hint:'Read it from the final character to the first.',hash:'ef7c317c08c1dcaa71ff7e8fe73221e227c55146241a66b4547aaa99818635fa'},
 {icon:'💾',title:'The Binary Graveyard',skill:'Binary and ASCII',story:'A dead computer flickers back to life. Its screen shows rows of eight glowing bits.',task:'Convert each 8-bit group to an ASCII character: 01001000 01000001 01001100 01001100 01001111 01010111 01000101 01000101 01001110 01111011 01000010 01001001 01001110 01000001 01010010 01011001 01011111 01000010 01000001 01010100 01010011 01111101',hint:'Convert every group from base 2 to a number, then use an ASCII table. 01001000 = 72 = H.',hash:'7a3208bc1487d851059b9403a324f522a7f314e67141ca6b4bb8a1549cd98e97'},
 {icon:'📦',title:'The Box Inside a Box',skill:'Double Base64',story:'A cursed message is wrapped in two identical magical layers. Opening only one is not enough.',task:'Decode this Base64 message twice: U0VGTVRFOVhSVVZPZTBSUFZVSk1SVjlVVWs5VlFreEZmUT09',hint:'Use a Base64 decoder. The first result is another Base64 string, so decode it again.',hash:'2b6df472e8ef02d5a89209be21a4f11c7d739df7e6f41af24966418b733bfc9e'},
 {icon:'⌨️',title:'The Librarian’s Riddle',skill:'Word riddle',story:'The ghost librarian will open the archive only if you name the object she describes.',task:'“I have keys but open no locks. I have space but no room. You can enter, but you cannot go inside. What am I?” Submit HALLOWEEN{ANSWER}.',hint:'You may be touching the answer while solving this challenge.',hash:'a37086e97e8a310c42d82a0bb4ece806ca03e7f9061bfd96ee96408576a383da'},
 {icon:'🌙',title:'The Moon-Key Manuscript',skill:'Vigenère cipher',story:'A witch protected her manuscript with a repeating keyword painted above the door: MOON.',task:'Decrypt the Vigenère ciphertext TOZYAKSRZ{QWCTSF_JUHQU} using the key MOON. Advance the key only for letters.',hint:'Repeat MOONMOON… under the letters. Subtract each key letter from the ciphertext letter; keep braces and underscores unchanged.',hash:'b2894dcfd7a3dcf202cdcb61a07d3a2a7cca59d84d7cfe1ae92f95e503a1ec45'},
 {icon:'🗝️',title:'The Final Crypt',skill:'Hex + reversal',story:'The master key is buried beneath two different transformations. Both must be undone before sunrise.',task:'First convert these hexadecimal bytes to ASCII, then reverse the entire result: 7d 52 45 54 53 41 4d 5f 54 48 47 49 4e 44 49 4d 7b 4e 45 45 57 4f 4c 4c 41 48',hint:'Hex 7d is “}”. After hex decoding, the message still looks backward.',hash:'fe08d153f4ff2bb44cfd4b61ae6e97b4ea774024688c110826c0a76d686b042c'},
 {icon:'🐦‍⬛',title:"The Raven's Odd Poem",skill:'Acrostic + riddle',story:'A raven scratched twelve lines into the wall. Its note says: “Even footsteps are echoes. Odd footsteps are real. Beginnings reveal the relic.”',task:'Read the first letter of only the odd-numbered lines, then submit the discovered relic as HALLOWEEN{RELIC}.<div class="poem">1. Cold flames tremble without heat.<br>2. Ravens argue with the rain.<br>3. Ash remembers every fire.<br>4. Footsteps fade behind the door.<br>5. Night hides a silver thread.<br>6. Mirrors borrow every face.<br>7. Darkness circles sleeping halls.<br>8. Thirteen bells refuse to ring.<br>9. Lonely stars guard the roof.<br>10. Windows watch but never blink.<br>11. Every shadow knows its name.<br>12. Dawn waits outside.</div>',hint:'Odd lines are 1, 3, 5, 7, 9, and 11. Take their first letters in order.',relic:'CANDLE',hash:'5d2262e5b859588fdda7aa86105f13fd24c05ad05edf572cfffc819f3012ff62'},
 {icon:'▦',title:'The Five-by-Five Cellar',skill:'Polybius square',story:'The floor is tiled as a 5×5 alphabet. I and J share a cell. Six pairs are carved into the trapdoor.',task:'Using a standard Polybius square, decode: 43 23 11 14 34 52. The first digit is the row, the second is the column. Submit HALLOWEEN{RELIC}.',hint:'Write A–Z into a 5×5 grid, left to right and top to bottom, combining I/J. For example, 11=A and 12=B.',relic:'SHADOW',hash:'07653e10a3b997429666d280b3bd980a777761f6353372e28185a0c877973e2c'},
 {icon:'⚡',title:'The Thirteenth Spark',skill:'XOR cryptography',story:'Four dead bytes need a spark. The voltage is hidden in the name of this school.',task:'The ciphertext bytes are 4e 5f 42 5a. XOR every byte with the same decimal key. The key is the number of the school. Convert the results to ASCII and submit HALLOWEEN{RELIC}.',hint:'School No. 13 gives decimal key 13, which is 0D in hex. Compute 4E XOR 0D, then repeat for every byte.',relic:'CROW',hash:'81b5ced32ce6c7156bdfa7831a048292ff12e33e2eb26798cb5b84db525dfeb1'},
 {icon:'🚂',title:'The Ghost Train Fence',skill:'Rail fence cipher',story:'A ghost train runs down and up across three rails. Reading each rail from left to right produced a scrambled message.',task:'Decrypt this 3-rail Rail Fence ciphertext: TOHIMHFUTRLCSONEREIO. The plaintext is an English sentence without spaces. Its final word is the relic. Submit HALLOWEEN{RELIC}.',hint:'Draw three rows. Place ciphertext letters into the zigzag rail pattern, then read diagonally down and up to recover the sentence.',relic:'MOON',hash:'24c3e81bae3098713b908d4a157c27512b1415b047f089656fe8f59a53dbbca0'},
 {icon:'🌅',title:'The Curse Before Dawn',skill:'Meta puzzle',story:'Four relics now surround the final seal. The inscription reads: “Positions matter. Take 4, 3, 4, 4 — in the order you found us.”',task:'Use the four relic words from challenges 11–14. Take the 4th letter of the first, the 3rd of the second, the 4th of the third, and the 4th of the fourth. The four letters name what defeats the night. Submit HALLOWEEN{ANSWER_BREAKS_CURSE}.',hint:'Recovered relics appear below. Number letters starting from 1, not 0. The extracted word is the opposite of nightfall.',hash:'244cf8c2b82b03115b3b8dfa6c07ac8d9a3bce00b0dad9cb052767259dea131d'}];
// The first flag for a sharp-eyed ghost hunter: HALLOWEEN{GHOST_IN_HTML}
let level=+(localStorage.ctfLevel||0),name=localStorage.ctfName||'',hints=+(localStorage.ctfHints||0),relics=JSON.parse(localStorage.ctfRelics||'[]');
const app=document.querySelector('#app');
function start(){name=document.querySelector('#name').value.trim()||'Ghost Hunter';level=0;hints=0;relics=[];localStorage.ctfName=name;localStorage.ctfLevel=0;localStorage.ctfHints=0;localStorage.ctfRelics='[]';render()}
function render(){if(!name){app.innerHTML=`<section class="hero"><div class="moon">🦇</div><p class="eyebrow">HALLOWEEN CTF · AGES 13+</p><h1>The Mystery<br><span>of School No. 13</span></h1><p class="lead">Fifteen seals have locked the exit. Solve the digital mysteries and hidden riddles before sunrise.</p><div class="chips"><span>15 challenges</span><span>≈ 100 minutes</span><span>Hints available</span></div><div class="panel"><label>Ghost hunter name</label><input id="name" maxlength="24" placeholder="For example: Shadow Fox"><button onclick="start()">Enter the school →</button></div></section>`;return}if(level>=puzzles.length){app.innerHTML=`<section class="hero"><div class="moon">☀️</div><p class="eyebrow">CASE CLOSED</p><h1>Sunrise<br><span>has arrived!</span></h1><p class="lead"><b>${esc(name)}</b>, all fifteen seals have been broken. Hints used: ${hints}.</p><button onclick="name='';localStorage.clear();render()">Play again</button></section>`;return}const p=puzzles[level],relicBox=level>=14&&relics.length?`<div class="relics"><b>RECOVERED RELICS</b><br>${relics.map(esc).join(' · ')}</div>`:'';app.innerHTML=`<header><b>SCHOOL <i>NO. 13</i></b><span>${esc(name)} ●</span></header><div class="layout"><aside><p class="eyebrow">THE NIGHT IS NOT OVER</p><div class="bar"><i style="width:${level/puzzles.length*100}%"></i></div><p>Seal ${level+1} of ${puzzles.length}</p>${puzzles.map((_,i)=>`<div class="step ${i==level?'active':''}">${i<level?'✓':('0'+(i+1)).slice(-2)} · ${i<level?'Broken':i==level?'You are here':'Locked'}</div>`).join('')}</aside><section class="challenge"><p class="eyebrow">CHALLENGE ${('0'+(level+1)).slice(-2)} · ${p.skill}</p><div class="icon">${p.icon}</div><h2>${p.title}</h2><p class="story">${p.story}</p><div class="task"><b>YOUR MISSION</b><p>${p.task}</p></div>${relicBox}<label>Enter the flag you found</label><div class="row"><input id="flag" placeholder="HALLOWEEN{...}"><button onclick="check()">Check</button></div><p id="msg"></p><button class="hint" onclick="showHint()">🕯️ Light a hint candle</button><p id="hint"></p></section></div>`}
async function check(){let v=document.querySelector('#flag').value.replace(/\s/g,'').toUpperCase(),m=document.querySelector('#msg'),bytes=new TextEncoder().encode(v),digest=await crypto.subtle.digest('SHA-256',bytes),hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');if(hash===puzzles[level].hash){m.className='ok';m.textContent='The seal is broken!';if(puzzles[level].relic&&!relics.includes(puzzles[level].relic)){relics.push(puzzles[level].relic);localStorage.ctfRelics=JSON.stringify(relics)}level++;localStorage.ctfLevel=level;setTimeout(render,800)}else{m.className='bad';m.textContent='The spell failed. Check the flag and try again.'}}
function showHint(){document.querySelector('#hint').textContent=puzzles[level].hint;hints++;localStorage.ctfHints=hints}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
